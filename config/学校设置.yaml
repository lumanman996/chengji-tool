# ===== 学校设置（全校通用，一般一学期改一次）=====
# “#”后面是说明，不影响运行。用记事本打开，改完保存即可。
# 第一次使用：先把下面两行的“××中学”改成自己学校的名称。

学校: ××中学
落款: ××中学{年级}组      # {年级} 会自动换成 七年级 / 八年级 / 九年级

# 年级：班级写法 = 年级字 + 班号，如 七1、八3、九6
年级:
  七年级: 七
  八年级: 八
  九年级: 九

# ----- 科目总表：全校 10 门科目及满分 -----
# 每次导入登分表时，程序自动识别表头里有哪些科目，只计算这些科目。
# 满分填 0 或留空 = 还没定；导入时这一科有成绩，程序会当场问满分。
科目满分:
  语文: 120
  数学: 100
  英语: 100
  物理: 70
  化学: 60
  道法: 50
  历史: 50
  生物: 0      # 还没定：导入时这一科有成绩，程序会当场问满分
  地理: 0      # 还没定
  体育: 0      # 还没定

# ----- 各年级平时考试、中考核算的固定科目 -----
# 用处：① 生成各年级的空白登分表模板；② 导入时如果比这里少了或多了科目，提醒一句。
# 实际统计仍以登分表里“有成绩的科目”为准，提醒不影响计算。
年级科目:
  七年级: [语文, 数学, 英语, 道法, 历史, 生物, 地理]
  八年级: [语文, 数学, 英语, 物理, 道法, 历史, 生物, 地理]
  九年级: [语文, 数学, 英语, 物理, 化学, 道法, 历史]
  中考: [语文, 数学, 英语, 物理, 化学, 道法, 历史, 生物, 地理, 体育]

# 某个年级满分与上表不同时，在这里单独写（没有就留空）
# 例如：
#   七年级:
#     数学: 120
年级满分调整: {}

# 登分表表头的其他写法（左边是登分表里可能出现的写法，右边是标准科目名）
科目别名:
  道德与法治: 道法
  思想品德: 道法
  政治: 道法
  生物学: 生物

# ----- 统计口径（沿用现行算法）-----
及格线比例: 0.6        # 满分的 60%（合格线）
优秀线比例: 0.8        # 满分的 80%

# ----- 算法方案：运行时用 --方案 选择，不写默认用“平时” -----
# 单科得分 = 优秀率×100×优秀率权重 + 及格率×100×及格率权重 + 平均分×平均分权重
# 平均分折算百分制：是 = 平均分÷满分×100 后再乘权重；否 = 直接用原始平均分
# 班级、教师的总得分 = 各科得分直接相加
算法方案:
  平时:                 # 七、八、九年级平时考试
    优秀率: 0.25
    及格率: 0.25
    平均分: 0.5
    平均分折算百分制: 是
  中考:                 # 九年级中考成绩核算
    优秀率: 0
    及格率: 0.4         # 合格率 40%
    平均分: 0.6         # 平均分 60%
    平均分折算百分制: 否

# ----- 班级结构分：和上面的算法方案同名，运行时跟着 --方案 走 -----
# 各项直接按比例折分：比率 × 分值。
#   平均成绩   = 本班总分平均分 ÷ 总分满分 × 分值
#   全科合格率 = 每一科都达到合格线的学生 ÷ 本班实考人数（全科优秀率同理，看优秀线）
#   参考率     = 实考人数 ÷ 应考人数（应考人数填在任课总表的「班级信息」工作表）
#   进线率     = 本班升学线以上人数 ÷ 本班实考人数
#   增值评价   = 先把其他各项加起来排名：第1名得满分，每低一名减“增值名次差”；
#                再与上次考试的综合名次比：每进步一名加“增值进退步”，每退步一名减，最高不超过满分
#   前10名每人加分 = 全级总分前10名（同分计入）每有一人，给本班加这么多分
# 分值填 0 或不写 = 这一项不算。
结构分方案:
  平时:
    平均成绩: 50
    全科合格率: 20
    全科优秀率: 20
    参考率: 5
    增值评价: 5
    增值名次差: 0.1
    增值进退步: 0.05
  中考:
    平均成绩: 50
    全科优秀率: 15
    全科合格率: 15
    参考率: 10
    进线率: 10
    前10名每人加分: 0.1

# ----- 发布版 PDF 导出哪些内容（是 = 导出，否 = 不导出）-----
# 这里是默认选择；每次运行时还会问一次，可以当场改（输入序号），也可以用 --PDF内容 指定。
# 全部写“否”= 默认不生成 PDF，只出 Excel。
发布版内容:
  成绩通报: 是        # 1 总体情况、各班综合排名、主要结论
  各科得分: 是        # 2 各班各科得分
  各科明细: 是        # 3 各科平均分、及格率、优秀率
  班级结构分: 是      # 4 班级结构分评比
  分数段: 是          # 5 线上学生分数段、各班上线率（仅供参考，不用可改成 否）
  前N名: 是           # 6 前 N 名各班人数
  教师排名: 是        # 7 任课教师成绩排名
  临界生名单: 是      # 8 升学线上下的学生名单

# 升学线比例：每次运行时会询问，可当场改（如 80%）；也可用 --升学比例 80% 指定
升学线比例: 0.85       # 默认：全级总分前 85%
临界范围: 15           # 升学线上下 15 分
高分线比例: 0.75       # “××分以上”= 总分满分的 75%（取整到 10 分）
前N名: [10, 20, 40, 50, 80, 100, 150, 200]
