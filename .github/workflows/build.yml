name: 测试、打包、发布

# 每次推送都会：跑测试 + 核对 Excel 公式 → 在 Windows 上打包成免安装程序并试跑。
# 推送形如 v1.0.0 的标签时，再把打好的压缩包发布到 Releases。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: 测试与公式核对
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: 单元测试
        run: python -m pytest -q
      - name: 用 LibreOffice 重算 Excel，与程序独立计算逐项核对
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-calc > /dev/null
          python tests/verify_all.py

  windows:
    name: Windows 免安装程序
    needs: test
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: 单元测试
        run: python -m pytest -q
      - name: 打包
        run: python packaging/build.py
      - name: 用打好的程序试跑示例数据（含生成 PDF）
        run: python packaging/smoke_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: chengji-tool-windows
          path: dist/*.zip
      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "成绩核算工具 $GITHUB_REF_NAME" --notes-file packaging/发布说明.md \
            || gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
