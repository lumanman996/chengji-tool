name: 测试、打包、发布

# 每次推送都会：跑测试 + 核对 Excel 公式 → 在 Windows 和 Mac 上打包并试跑。
# 推送形如 v2.0.0 的标签时，再把打好的压缩包发布到 Releases。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: 测试与公式核对
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: 单元测试（含界面的端到端测试）
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python -m pytest -q
      - name: 用 LibreOffice 重算 Excel，与程序独立计算逐项核对
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-calc > /dev/null
          python tests/verify_all.py

  package:
    name: 打包（${{ matrix.name }}）
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows }
          - { os: macos-latest, name: Mac }
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: 放入试用与激活模块（保密项里有才放；没有就打不限制的版本）
        shell: bash
        env:
          LICENSE_IMPL: ${{ secrets.LICENSE_IMPL }}
        run: python -c "import base64, os, pathlib; d = os.environ.get('LICENSE_IMPL', ''); d and pathlib.Path('chengji/_license_impl.py').write_bytes(base64.b64decode(d)); print('license module:', bool(d))"
      - name: 打包
        run: python packaging/build.py
      - name: 用打好的程序自检、试跑示例数据（含生成 PDF），检查防篡改，再走一遍一键更新
        run: python packaging/smoke_test.py
      - name: 用 Windows 自带的杀毒软件扫一遍打好的程序（只看结果，扫不了不算失败）
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mp)) { "这台机器上没有 Windows Defender，跳过"; exit 0 }
          & $mp -SignatureUpdate | Out-Null
          & $mp -Scan -ScanType 3 -File "$PWD\dist" -DisableRemediation
          if ($LASTEXITCODE -eq 2) { "::warning::Windows Defender 报告发现威胁，请人工检查"; exit 1 } else { "Windows Defender 扫描结果：没有发现威胁（退出码 $LASTEXITCODE）" }
      - uses: actions/upload-artifact@v7
        with:
          name: chengji-tool-${{ matrix.name }}
          path: dist/*.zip
      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python packaging/release_notes.py "$GITHUB_REF_NAME" release_notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "分寸 · 成绩核算 $GITHUB_REF_NAME" --notes-file release_notes.md \
            || gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
